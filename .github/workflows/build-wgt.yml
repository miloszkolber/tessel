name: Build Tessel WGT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tizen-app/**'
      - '.github/workflows/build-wgt.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test tests/tizen-app/*.test.js
      - name: Package unsigned app
        run: bash tizen-app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tessel-unsigned
          path: dist/tessel.wgt
